name: NLFR bereik-test

# Bereikbaarheidstest: kan een GitHub Actions-runner nederlanders.fr ophalen?
# (Vercel wordt op verbindingsniveau geweigerd.) Draait op handmatige dispatch
# en op een push die DIT workflow-bestand zelf raakt. De paths-filter includeert
# alleen dit bestand, zodat de commit-back naar scripts/ de workflow niet
# hertriggert; "[skip ci]" in die commit is de tweede waarborg.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nlfr-bereik-test.yml'

permissions:
  contents: write

jobs:
  bereik-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Haal NLFR-URLs op en schrijf resultaat
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          OUT="scripts/BEREIK-TEST-RESULTAAT.md"
          mkdir -p scripts
          TMP="$(mktemp -d)"

          {
            echo "# NLFR bereik-test — resultaat"
            echo
            echo "Uitgevoerd door GitHub Actions (ubuntu-latest) op $(date -u '+%Y-%m-%d %H:%M:%S UTC')."
            echo
            echo "Doel: kan een Actions-runner nederlanders.fr server-side ophalen?"
            echo "Per URL: HTTP-statuscode, response-grootte (bytes), herkenbare markers, eerste 300 tekens."
            echo
          } > "$OUT"

          # Argumenten: url | markerbeschrijving | grep-patroon-1 | grep-patroon-2 (optioneel)
          check() {
            local url="$1" mdesc="$2" p1="$3" p2="$4"
            local body="$TMP/body.html" errf="$TMP/err.txt"
            local out code size markers first rc curlerr
            local kcode ksize krc fallback_used bodyfor

            # --- Beveiligde poging (normale TLS-verificatie) ---
            rc=0
            out="$(curl -sS -A "$UA" --max-time 15 -o "$body" -w '%{http_code} %{size_download}' "$url" 2>"$errf")" || rc=$?
            code="${out%% *}"
            size="${out##* }"
            [ -z "$code" ] && code="000"
            [ -z "$size" ] && size="0"
            [ -f "$body" ] || : > "$body"
            curlerr="$(tr '\n\r\t' '   ' < "$errf" | sed 's/  */ /g' | head -c 200)"

            # --- Diagnostische fallback: alleen als de beveiligde poging faalde ---
            # curl error 60 (cert kan niet geverifieerd) heeft twee mogelijke oorzaken:
            #  (a) egress-proxy die TLS intercepteert met een niet-vertrouwde CA, of
            #  (b) NING levert een incomplete cert-chain (ontbrekend intermediate).
            # Een insecure (-k) probe onderscheidt beide: krijgen we dán NING-HTML terug,
            # dan is NING WEL bereikbaar vanaf Actions en is het "slechts" een chain-issue.
            # Dit is puur een verkenningsdiagnose; nooit voor productie gebruiken.
            fallback_used="nee"
            bodyfor="$body"
            if [ "$code" = "000" ]; then
              fallback_used="ja"
              krc=0
              kout="$(curl -k -sS -A "$UA" --max-time 15 -o "$TMP/body.k" -w '%{http_code} %{size_download}' "$url" 2>"$TMP/err.k")" || krc=$?
              kcode="${kout%% *}"
              ksize="${kout##* }"
              [ -z "$kcode" ] && kcode="000"
              [ -z "$ksize" ] && ksize="0"
              [ -f "$TMP/body.k" ] || : > "$TMP/body.k"
              bodyfor="$TMP/body.k"   # markers/fragment o.b.v. wat de -k-probe opleverde
            fi

            markers="nee"
            if grep -qi -e "$p1" "$bodyfor" 2>/dev/null; then
              markers="ja ($p1)"
            elif [ -n "$p2" ] && grep -qi -e "$p2" "$bodyfor" 2>/dev/null; then
              markers="ja ($p2)"
            fi

            first="$(head -c 300 "$bodyfor" | tr -d '\000' | tr '\n\r\t' '   ')"

            {
              echo "## $url"
              echo
              echo "- HTTP-statuscode (beveiligd): \`$code\`"
              echo "- Response-grootte (beveiligd): \`$size\` bytes"
              echo "- curl-exitcode (beveiligd): \`$rc\`"
              [ -n "$curlerr" ] && echo "- curl-foutmelding (beveiligd): \`$curlerr\`"
              if [ "$fallback_used" = "ja" ]; then
                echo "- Insecure fallback-probe (\`curl -k\`, alleen diagnose):"
                echo "  - HTTP-statuscode: \`$kcode\`"
                echo "  - Response-grootte: \`$ksize\` bytes"
                echo "  - curl-exitcode: \`$krc\`"
              fi
              echo "- Markers ($mdesc): **$markers**"
              if [ "$fallback_used" = "ja" ]; then
                echo "- Eerste 300 tekens (uit fallback-probe):"
              else
                echo "- Eerste 300 tekens:"
              fi
              echo
              echo '~~~html'
              echo "$first"
              echo '~~~'
              echo
            } >> "$OUT"

            echo "[beveiligd $code rc=$rc][fallback ${kcode:-n.v.t.}] markers=$markers  $url"
          }

          check "https://www.nederlanders.fr/main/search/search?q=septic+tank" \
                'zoekpagina: "toegevoegd door" of /profiles/blogs/' \
                "toegevoegd door" "/profiles/blogs/"

          check "https://www.nederlanders.fr/profiles/blog/feed?xn_auth=no" \
                'feed: <rss of <feed' \
                "<rss" "<feed"

          check "https://www.nederlanders.fr/profiles/blog/list?promoted=1" \
                'promoted-lijst: /profiles/blogs/' \
                "/profiles/blogs/" ""

          rm -rf "$TMP"
          echo "----- $OUT -----"
          cat "$OUT"

      - name: Commit resultaat terug
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/BEREIK-TEST-RESULTAAT.md
          if git diff --staged --quiet; then
            echo "Geen wijziging om te committen."
          else
            git commit -m "bereik-test resultaat [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
