name: NLFR bereik-test

# Bereikbaarheidstest: kan een GitHub Actions-runner nederlanders.fr ophalen?
# (Vercel wordt op verbindingsniveau geweigerd.) Draait op handmatige dispatch
# en op een push die DIT workflow-bestand zelf raakt. De paths-filter includeert
# alleen dit bestand, zodat de commit-back naar scripts/ de workflow niet
# hertriggert; "[skip ci]" in die commit is de tweede waarborg.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nlfr-bereik-test.yml'

permissions:
  contents: write

jobs:
  bereik-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Haal NLFR-URLs op en schrijf resultaat
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          OUT="scripts/BEREIK-TEST-RESULTAAT.md"
          mkdir -p scripts
          TMP="$(mktemp -d)"

          {
            echo "# NLFR bereik-test — resultaat"
            echo
            echo "Uitgevoerd door GitHub Actions (ubuntu-latest) op $(date -u '+%Y-%m-%d %H:%M:%S UTC')."
            echo
            echo "Doel: kan een Actions-runner nederlanders.fr server-side ophalen?"
            echo "Per URL: HTTP-statuscode, response-grootte (bytes), herkenbare markers, eerste 300 tekens."
            echo
          } > "$OUT"

          # Argumenten: url | markerbeschrijving | grep-patroon-1 | grep-patroon-2 (optioneel)
          check() {
            local url="$1" mdesc="$2" p1="$3" p2="$4"
            local body="$TMP/body.html" errf="$TMP/err.txt"
            local out code size markers first rc curlerr
            local kcode ksize krc fallback_used bodyfor

            # --- Beveiligde poging (normale TLS-verificatie) ---
            rc=0
            out="$(curl -sS -A "$UA" --max-time 15 -o "$body" -w '%{http_code} %{size_download}' "$url" 2>"$errf")" || rc=$?
            code="${out%% *}"
            size="${out##* }"
            [ -z "$code" ] && code="000"
            [ -z "$size" ] && size="0"
            [ -f "$body" ] || : > "$body"
            curlerr="$(tr '\n\r\t' '   ' < "$errf" | sed 's/  */ /g' | head -c 200)"

            # --- Diagnostische fallback: alleen als de beveiligde poging faalde ---
            # curl error 60 (cert kan niet geverifieerd) heeft twee mogelijke oorzaken:
            #  (a) egress-proxy die TLS intercepteert met een niet-vertrouwde CA, of
            #  (b) NING levert een incomplete cert-chain (ontbrekend intermediate).
            # Een insecure (-k) probe onderscheidt beide: krijgen we dán NING-HTML terug,
            # dan is NING WEL bereikbaar vanaf Actions en is het "slechts" een chain-issue.
            # Dit is puur een verkenningsdiagnose; nooit voor productie gebruiken.
            fallback_used="nee"
            bodyfor="$body"
            if [ "$code" = "000" ]; then
              fallback_used="ja"
              krc=0
              kout="$(curl -k -sS -A "$UA" --max-time 15 -o "$TMP/body.k" -w '%{http_code} %{size_download}' "$url" 2>"$TMP/err.k")" || krc=$?
              kcode="${kout%% *}"
              ksize="${kout##* }"
              [ -z "$kcode" ] && kcode="000"
              [ -z "$ksize" ] && ksize="0"
              [ -f "$TMP/body.k" ] || : > "$TMP/body.k"
              bodyfor="$TMP/body.k"   # markers/fragment o.b.v. wat de -k-probe opleverde
            fi

            markers="nee"
            if grep -qi -e "$p1" "$bodyfor" 2>/dev/null; then
              markers="ja ($p1)"
            elif [ -n "$p2" ] && grep -qi -e "$p2" "$bodyfor" 2>/dev/null; then
              markers="ja ($p2)"
            fi

            first="$(head -c 300 "$bodyfor" | tr -d '\000' | tr '\n\r\t' '   ')"

            {
              echo "## $url"
              echo
              echo "- HTTP-statuscode (beveiligd): \`$code\`"
              echo "- Response-grootte (beveiligd): \`$size\` bytes"
              echo "- curl-exitcode (beveiligd): \`$rc\`"
              [ -n "$curlerr" ] && echo "- curl-foutmelding (beveiligd): \`$curlerr\`"
              if [ "$fallback_used" = "ja" ]; then
                echo "- Insecure fallback-probe (\`curl -k\`, alleen diagnose):"
                echo "  - HTTP-statuscode: \`$kcode\`"
                echo "  - Response-grootte: \`$ksize\` bytes"
                echo "  - curl-exitcode: \`$krc\`"
              fi
              echo "- Markers ($mdesc): **$markers**"
              if [ "$fallback_used" = "ja" ]; then
                echo "- Eerste 300 tekens (uit fallback-probe):"
              else
                echo "- Eerste 300 tekens:"
              fi
              echo
              echo '~~~html'
              echo "$first"
              echo '~~~'
              echo
            } >> "$OUT"

            echo "[beveiligd $code rc=$rc][fallback ${kcode:-n.v.t.}] markers=$markers  $url"
          }

          check "https://www.nederlanders.fr/main/search/search?q=septic+tank" \
                'zoekpagina: "toegevoegd door" of /profiles/blogs/' \
                "toegevoegd door" "/profiles/blogs/"

          check "https://www.nederlanders.fr/profiles/blog/feed?xn_auth=no" \
                'feed: <rss of <feed' \
                "<rss" "<feed"

          check "https://www.nederlanders.fr/profiles/blog/list?promoted=1" \
                'promoted-lijst: /profiles/blogs/' \
                "/profiles/blogs/" ""

          rm -rf "$TMP"
          echo "----- $OUT -----"
          cat "$OUT"

      - name: Certketen aanvullen en verifieren
        run: |
          set -o pipefail
          DOMAIN="www.nederlanders.fr"
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          OUT="scripts/BEREIK-TEST-RESULTAAT.md"
          CERTDIR="certs"
          BUNDLE="$CERTDIR/ning-ca-bundle.pem"
          TMP="$(mktemp -d)"
          mkdir -p "$CERTDIR"

          {
            echo "---"
            echo
            echo "## Certketen aanvullen (fix voor curl error 60)"
            echo
          } >> "$OUT"

          # 1) Aangeboden keten dumpen.
          openssl s_client -connect "${DOMAIN}:443" -servername "${DOMAIN}" -showcerts </dev/null 2>/dev/null > "$TMP/chain.txt" || true
          served="$(grep -c 'BEGIN CERTIFICATE' "$TMP/chain.txt" || true)"
          echo "- Certificaten die de server aanbiedt: **${served:-0}**" >> "$OUT"

          # Leaf = eerste certificaat.
          awk 'BEGIN{c=0} /BEGIN CERTIFICATE/{c++} c==1{print} /END CERTIFICATE/{if(c==1)exit}' "$TMP/chain.txt" > "$TMP/leaf.pem"

          leaf_issuer="$(openssl x509 -in "$TMP/leaf.pem" -noout -issuer 2>/dev/null | sed 's/^issuer=//')"
          echo "- Issuer van het leaf-certificaat: \`${leaf_issuer}\`" >> "$OUT"

          # 2) Intermediate ophalen via het AIA-veld (CA Issuers URI) van het leaf.
          aia="$(openssl x509 -in "$TMP/leaf.pem" -noout -text 2>/dev/null | grep -oE 'CA Issuers - URI:http[^[:space:]]+' | sed 's/^CA Issuers - URI://' | head -1 || true)"
          echo "- AIA CA-Issuers-URL: \`${aia:-<geen>}\`" >> "$OUT"

          got_inter="nee"
          if [ -n "$aia" ]; then
            curl -sSL --max-time 15 -o "$TMP/inter.raw" "$aia" || true
            # Kan DER, PEM of PKCS7 zijn — normaliseer naar PEM.
            if openssl x509 -inform DER -in "$TMP/inter.raw" -out "$TMP/inter.pem" 2>/dev/null; then
              got_inter="ja (DER)"
            elif openssl x509 -inform PEM -in "$TMP/inter.raw" -out "$TMP/inter.pem" 2>/dev/null; then
              got_inter="ja (PEM)"
            elif openssl pkcs7 -inform DER -in "$TMP/inter.raw" -print_certs -out "$TMP/inter.pem" 2>/dev/null; then
              got_inter="ja (PKCS7)"
            fi
          fi
          echo "- Intermediate opgehaald: **${got_inter}**" >> "$OUT"

          # 3) Bijbehorende root uit de systeem-truststore zoeken. De root is het
          #    certificaat waarvan het subject gelijk is aan de issuer van het
          #    intermediate; we matchen op hash (issuer_hash van intermediate ==
          #    subject_hash van de root). Eerst de vooraf-gehashte symlinks, anders
          #    de gebundelde store ca-certificates.crt certificaat-voor-certificaat.
          got_root="nee"
          if [ -f "$TMP/inter.pem" ]; then
            inter_subject="$(openssl x509 -in "$TMP/inter.pem" -noout -subject 2>/dev/null | sed 's/^subject=//')"
            echo "- Intermediate: \`${inter_subject}\`" >> "$OUT"
            rooth="$(openssl x509 -in "$TMP/inter.pem" -noout -issuer_hash 2>/dev/null || true)"
            # (a) Doorloop de vooraf-gehashte truststore-symlinks en match op
            #     subject_hash == issuer_hash van het intermediate (zelfde openssl,
            #     dus consistente hash — robuuster dan bestandsnaam raden).
            for f in /etc/ssl/certs/*.0 /etc/ssl/certs/*.pem; do
              [ -e "$f" ] || continue
              sh="$(openssl x509 -in "$f" -noout -subject_hash 2>/dev/null || true)"
              if [ -n "$sh" ] && [ "$sh" = "$rooth" ]; then
                cp "$f" "$TMP/root.pem"
                got_root="ja (truststore)"
                break
              fi
            done
            # (b) Niet in de store (bv. nieuwe ECDSA-root): haal de root via het
            #     AIA-veld van het intermediate zelf.
            if [ "$got_root" = "nee" ]; then
              raia="$(openssl x509 -in "$TMP/inter.pem" -noout -text 2>/dev/null | grep -oE 'CA Issuers - URI:http[^[:space:]]+' | sed 's/^CA Issuers - URI://' | head -1 || true)"
              if [ -n "$raia" ]; then
                curl -sSL --max-time 15 -o "$TMP/root.raw" "$raia" || true
                if openssl x509 -inform DER -in "$TMP/root.raw" -out "$TMP/root.pem" 2>/dev/null; then
                  got_root="ja (AIA)"
                elif openssl x509 -inform PEM -in "$TMP/root.raw" -out "$TMP/root.pem" 2>/dev/null; then
                  got_root="ja (AIA)"
                fi
              fi
            fi
          fi
          echo "- Root gevonden: **${got_root}**" >> "$OUT"

          # 4) Bundle samenstellen: intermediate + root (publieke certificaten).
          : > "$BUNDLE"
          if [ -f "$TMP/inter.pem" ]; then
            {
              echo "# NLFR CA-bundle — publieke certificaten, geen geheimen."
              echo "# Automatisch samengesteld door .github/workflows/nlfr-bereik-test.yml."
              echo "# Vult de door de server weggelaten keten aan (fix voor curl error 60)."
              echo "# Bevat het intermediate en (indien gevonden) de root."
              echo "# Intermediate: ${inter_subject}"
            } >> "$BUNDLE"
            openssl x509 -in "$TMP/inter.pem" >> "$BUNDLE"
          fi
          if [ -f "$TMP/root.pem" ]; then
            root_subject="$(openssl x509 -in "$TMP/root.pem" -noout -subject 2>/dev/null | sed 's/^subject=//')"
            echo "# Root: ${root_subject}" >> "$BUNDLE"
            openssl x509 -in "$TMP/root.pem" >> "$BUNDLE"
          fi
          echo "- Bundle geschreven naar \`$BUNDLE\` ($(grep -c 'BEGIN CERTIFICATE' "$BUNDLE" 2>/dev/null || echo 0) certificaten)" >> "$OUT"

          # 5) Verifieren: curl MET de bundle, ZONDER -k, moet 200 geven.
          vcode="$(curl -sS -A "$UA" --max-time 15 --cacert "$BUNDLE" -o /dev/null -w '%{http_code}' "https://${DOMAIN}/" 2>"$TMP/verr.txt" || true)"
          [ -z "$vcode" ] && vcode="000"
          verr="$(tr '\n\r\t' '   ' < "$TMP/verr.txt" | sed 's/  */ /g' | head -c 200)"
          {
            echo "- Verificatie \`curl --cacert $BUNDLE https://${DOMAIN}/\` (zonder \`-k\`): HTTP **\`${vcode}\`**"
            [ -n "$verr" ] && echo "  - curl-melding: \`${verr}\`"
            if [ "$vcode" = "200" ]; then
              echo "  - ✅ De aangevulde keten werkt: NING is nu bereikbaar met normale TLS-verificatie."
            else
              echo "  - ⚠️ Nog geen 200 — zie melding hierboven."
            fi
            echo
          } >> "$OUT"

          rm -rf "$TMP"
          echo "----- $OUT -----"
          cat "$OUT"
          echo "----- $BUNDLE -----"
          head -n 6 "$BUNDLE" || true

      - name: Commit resultaat terug
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/BEREIK-TEST-RESULTAAT.md certs/ning-ca-bundle.pem
          if git diff --staged --quiet; then
            echo "Geen wijziging om te committen."
          else
            git commit -m "bereik-test resultaat + CA-bundle [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
