<!-- Referentiekopie — plakken als NING-bestand op de nieuwe zoek-pagina -->
<!--
  NLFR AI-ZOEK — pagina-inhoud voor de nieuwe NING-pagina.

  Pagina-URL: https://www.nederlanders.fr/page/ai-zoek
  Deze codeblok komt in de body van die NING-pagina (de NING-pagina levert zelf
  de site-header en het menu; hier alleen het zoek-iframe + script).

  STRIPBESTENDIG: NING's pagina-editor stript attributen en <style>, waardoor het
  iframe op de standaardbreedte (300px) terugvalt. Daarom staat het iframe hier
  KAAL (alleen een id) en zet het script bij initialisatie ALLE opmaak via
  element.style + setAttribute. Ook de omliggende container krijgt width/maxWidth
  100% voor het geval NING een smalle module-wrapper toevoegt.

  Het script:
   (a) geeft ?q= uit de pagina-URL door aan de app;
   (b) leest ning.CurrentProfile en voegt &lid=1 toe bij een ingelogd lid
       (zachte ledenpoort: leden zien de AI-samenvatting);
   (c) bevat de nlfrZoekHeight-listener met alleen-bij-wijziging-bescherming.
  GEEN ResizeObserver en geen ander hoogtemechanisme — de app meldt zijn hoogte.
-->
<iframe id="zoek"></iframe>

<script>
(function () {
  var zoek = document.getElementById("zoek");

  // Alle opmaak in JS zetten — stripbestendig (NING verwijdert attributen/CSS).
  zoek.style.display = "block";
  zoek.style.width = "100%";
  zoek.style.border = "0";
  zoek.style.height = "600px";        // starthoogte; groeit mee via nlfrZoekHeight
  zoek.style.background = "#f6f2ef";
  zoek.setAttribute("scrolling", "no");
  zoek.setAttribute("title", "AI-zoekresultaten");
  zoek.setAttribute("name", "zoek");

  // Omliggende container ook op volle breedte, mocht NING een smalle wrapper
  // toevoegen.
  var wrap = zoek.parentNode;
  if (wrap && wrap.style) {
    wrap.style.width = "100%";
    wrap.style.maxWidth = "100%";
  }

  // (a) zoekterm uit de pagina-URL
  var q = "";
  try { q = new URLSearchParams(window.location.search).get("q") || ""; } catch (e) {}

  // (b) ingelogd lid? ning.CurrentProfile staat op de NING-pagina zelf.
  var cp = null;
  try {
    cp = (window.ning && window.ning.CurrentProfile) ||
         (window.parent && window.parent.ning && window.parent.ning.CurrentProfile) || null;
  } catch (e) { cp = null; }
  var lid = !!(cp && cp.id);

  var src = "https://nlfr-if-zoek.vercel.app/?embed=1";
  if (lid) src += "&lid=1";
  if (q) src += "&q=" + encodeURIComponent(q);
  zoek.src = src;

  // (c) hoogte meegroeien — alleen bij een gewijzigde waarde.
  var lastZoekH = 0;
  window.addEventListener("message", function (e) {
    if (!e || !e.data) return;
    if (e.data.nlfrZoekHeight && e.data.nlfrZoekHeight !== lastZoekH) {
      lastZoekH = e.data.nlfrZoekHeight;
      zoek.style.height = (lastZoekH + 8) + "px";
    }
  });
})();
</script>
