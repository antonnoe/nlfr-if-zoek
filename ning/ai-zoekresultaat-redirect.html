<!-- Referentiekopie — plakken als NING-bestand ai-zoekresultaat-redirect (vervangt de oude inhoud) -->
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AI-zoek is verhuisd — Nederlanders.fr</title>
<!--
  Doorverwijzing (22-07-2026): de AI-zoek staat voortaan op
  https://www.nederlanders.fr/page/ai-zoek — dit bestand stuurt oude
  links (incl. ?q=) automatisch door.
-->
<meta http-equiv="refresh" content="2;url=https://www.nederlanders.fr/page/ai-zoek">
<style>
  body { font-family: system-ui, sans-serif; background: #f6f2ef; color: #3a3330; display: grid; place-items: center; min-height: 90vh; margin: 0; }
  .kaart { text-align: center; padding: 24px; }
  a { color: #800000; font-weight: 600; }
</style>
</head>
<body>
  <div class="kaart">
    <p>De AI-zoek is verhuisd. Je wordt doorgestuurd…</p>
    <p><a id="doel" href="https://www.nederlanders.fr/page/ai-zoek">Klik hier als het niet vanzelf gaat</a></p>
  </div>
  <script>
    (function () {
      var doel = "https://www.nederlanders.fr/page/ai-zoek";
      try {
        var q = new URLSearchParams(window.location.search).get("q");
        if (q) doel += "?q=" + encodeURIComponent(q);
      } catch (e) {}
      document.getElementById("doel").href = doel;
      window.location.replace(doel);
    })();
  </script>
</body>
</html>
