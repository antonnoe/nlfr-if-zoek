  Plaats deze HTML op de pagina die je in het iframe laadt (bv. /nlfr-menu-2).
  Het iframe past zijn hoogte automatisch aan via postMessage(nlfrMenuHeight).
  FIX 1: hoogte wordt gemeten op de .card (niet body.scrollHeight) en alleen
         gemeld bij wijziging — dit stopt de oneindige groei-lus.
  FIX 2: home-knop heeft target="_parent" — laadt niet meer in het iframe zelf.

-->

  .searchbox input { flex: 1 1 auto; border: none; background: transparent; font-size: 15px; color: #3a3330; padding: 7px 0; min-width: 0; }

  .clear.show { display: grid; }

  .pull { position: relative; flex: 1 1 0; min-width: 0; display: flex; }

  .pull-btn.active { background: #fff; border-color: var(--brand); }

  .admin { display: none; }
  .admin.show { display: grid; }
  .admin.active { background: var(--brand); color: #fff; border-color: var(--brand); }
  .doors { display: flex; gap: 8px; flex: 1 1 auto; }
  .door { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 7px 6px; border-radius: 12px; line-height: 1.15; border: 1px solid rgba(128,0,0,.14); background: rgba(128,0,0,.04); color: var(--brand); transition: background .15s, border-color .15s; }

  .drawer.open { display: block; }
  @keyframes az { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(1.5); } }

  .cta .cs { font-size: 13px; }

  .cta.tint:hover { background: rgba(128,0,0,.12); }
  .cta.tint .cs { color: #8a7f7c; }
  .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--brand); animation: pulse 1.6s ease-in-out infinite; }

  .teaser h3 { font-family: 'Poppins',sans-serif; font-weight: 700; font-size: 18px; margin: 0 0 6px; color: #5c0f0f; }
  .teaser p { margin: 0 0 12px; font-size: 14px; color: #6d6360; }
  .perks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 20px; margin: 0 0 16px; max-width: 640px; }
  .perk { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #5b524f; }
  .teaser .btns { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .btn-p { background: var(--brand); color: #fff; padding: 11px 20px; border-radius: 10px; font-family: 'Poppins',sans-serif; font-weight: 600; font-size: 14px; white-space: nowrap; }
  .btn-p:hover { filter: brightness(1.1); }
  .btn-o { background: #fff; color: var(--brand); border: 1.5px solid var(--brand); padding: 11px 20px; border-radius: 10px; font-family: 'Poppins',sans-serif; font-weight: 600; font-size: 14px; white-space: nowrap; }
  .btn-o:hover { background: rgba(128,0,0,.06); }
  .adminlinks { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .adminlinks a { padding: 6px 12px; font-size: 13px; color: #5b524f; border-radius: 8px; background: #fff; border: 1px solid rgba(128,0,0,.12); font-weight: 600; }

  .band { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 16px; border-top: 1px solid rgba(128,0,0,.1); background: #fdf9f8; }

  .eco { display: flex; align-items: center; gap: 10px; font-size: 13.5px; white-space: nowrap; }

  var TOPICS = [
    ["🚚 Vervoershub",U("/group/vervoerspagina")],["📖 Nedergids.nl","https://nedergids.nl/"],["🗣️ Franse taal leren",U("/page/frantastique-1")],
    ["Café Claude","https://www.cafeclaude.fr/"],["Infofrankrijk","https://infofrankrijk.com/"],["Communities Abroad","https://www.communitiesabroad.com"],
    ["Doneer",U("/page/fundraising-en-donaties"),1],["Bouw",U("/profiles/blog/list?tag=Bouw")],["Correspondentie",U("/profiles/blog/list?tag=Correspondentie")],
    ["Cursussen",U("/profiles/blog/list?tag=Cursussen+en+Opleidingen")],["Dieren",U("/profiles/blog/list?tag=Dieren")],["Geldzaken",U("/profiles/blog/list?tag=Geldzaken")],
    ["Gezondheid/Sport",U("/profiles/blog/list?tag=Gezondheid%2C+Sport+en+Spel")],["Hulpverlening",U("/page/hulpverlening-in-frankrijk"),1],["Huisregels",U("/page/huisregels"),1],
    ["Kringloopwinkel","https://www.facebook.com/groups/kringloopfrankrijk/"],["Korte verhalen",U("/profiles/blog/list?tag=Korte+Verhalen")],["Leestips",U("/profiles/blog/list?promoted=1"),1],
    ["Woordenlijst",U("/profiles/blog/list?tag=Lexicon")],["MKB",U("/profiles/blog/list?tag=Midden-+en+Kleinbedrijf"),1],["Migratie",U("/profiles/blog/list?tag=Migratie")],
    ["Onderwijs",U("/profiles/blog/list?tag=Onderwijs")],["Ouderverzorging",U("/profiles/blog/list?tag=Ouderverzorging")],["Overheid en wet",U("/profiles/blog/list?tag=Overheid")],
    ["Overige diensten",U("/profiles/blog/list?tag=Overige+Diensten")],["Rubrieken",U("/page/rubrieken")],["Telecommunicatie",U("/profiles/blog/list?tag=Telecommunicatie")],
    ["Roerende goederen te koop",U("/profiles/blog/list?tag=Te+Koop+Aangeboden")],["Te koop gevraagd",U("/profiles/blog/list?tag=Te+Koop+Gevraagd")],["Vervoer",U("/profiles/blog/list?tag=Vervoer")],
    ["Verenigingen",U("/profiles/blogs/overzicht-van-nederlandse-verenigingen-in-frankrijk")],["Werkaanbod",U("/profiles/blog/list?tag=Werk+Aangeboden")],["Werk algemeen",U("/profiles/blog/list?tag=Werk+Algemeen")],
    ["Werk gevraagd",U("/profiles/blog/list?tag=Werk+Gevraagd")],["Woningbeheer",U("/profiles/blog/list?tag=Woningbeheer+en+Huishouding")],["Huizen aangeboden",U("/profiles/blog/list?tag=Woningen+Aangeboden")],
    ["Wonen algemeen",U("/profiles/blog/list?tag=Woningen+Algemeen")],["Woningen gevraagd",U("/profiles/blog/list?tag=Woningen+Gevraagd")],["Word sponsor",U("/page/sponsorprogramma"),1]
  ];

  var DOOR_DEFS = [["lezen","Lezen","rubrieken"],["doen","Meedoen","plaatsen & steunen"],["vinden","Vinden","tools & hulp"],["mijn","Mijn NLFR","leden"],["nieuws","Nieuws","& feeds"]];

  // ---- Build nav ----
  var doorsEl = document.getElementById("doors");
  var lock = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity:.85"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  var caret = '<svg class="caret" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  DOOR_DEFS.forEach(function(d){
    var locked = (d[0] === "mijn" && !isMember);
    var b = document.createElement("button");
    b.className = "door" + (locked ? " locked" : "");
    b.setAttribute("data-door", d[0]);
    b.innerHTML = '<span class="t">' + d[1] + caret + (locked ? lock : '') + '</span><span class="s">' + d[2] + '</span>';
    doorsEl.appendChild(b);
  });

  // ---- Build band ----
  document.getElementById("bandleft").innerHTML =
    link(U("/profiles/blog/new"),"Plaats bericht","light") +
    link(U("/page/betaalpagina-berichten"),"Plaats advertentie","light") +
    link(U("/diensten"),"Diensten","fill");

  // ---- Admin button ----
  var adminBtn = document.getElementById("adminbtn");
  if (isAdmin) adminBtn.classList.add("show");

  // ---- Drawer rendering ----
  var drawer = document.getElementById("drawer");
  function groupsHTML(groups, cols){
    var h = '<div class="cols" style="grid-template-columns:repeat('+cols+',1fr)">';
    groups.forEach(function(g){
      h += '<div class="grp"><div class="h">'+g[0]+'</div><div class="lk">';
      g[1].forEach(function(l){ h += link(l[1], l[0], l[2] ? "accent" : "item"); });
      h += '</div></div>';
    });
    return h + '</div>';
  }
  function build(target){
    if (DOORS[target]) { drawer.innerHTML = groupsHTML(DOORS[target].groups, DOORS[target].cols); return; }
    if (target === "mijn") {
      if (isMember) { drawer.innerHTML = groupsHTML(MEMBER_GROUPS, 2); return; }
      var p = PERKS.map(function(x){ return '<div class="perk"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>'+x+'</div>'; }).join("");
      drawer.innerHTML = '<div class="teaser"><h3>Word gratis lid — dan kan er meer</h3><p>Als lid heeft u opties die bezoekers niet zien:</p><div class="perks">'+p+'</div><div class="btns">'+
        '<a class="btn-p" href="'+U("/main/authorization/signUp")+'" target="_parent">Word lid — gratis</a>'+
        '<a class="btn-o" href="'+U("/main/authorization/signIn")+'" target="_parent">Meld je aan</a></div></div>';
      return;
    }
    if (target === "admin") {
      drawer.innerHTML = '<div class="adminlinks"><span class="h">Beheer</span>' + ADMIN_LINKS.map(function(l){ return link(l[1], l[0], ""); }).join("") + '</div>';
      return;
    }
    if (target === "topics") {
      var c = '<div class="ctas">' + CTAS.map(function(x){
        var title = (x.live ? '<span class="dot"></span>' : '') + x.t;
        return '<a class="cta '+(x.fill?"fill":"tint")+'" href="'+x.href+'" target="'+tgt(x.href)+'"'+(tgt(x.href)==="_blank"?' rel="noopener"':'')+'><span class="ct">'+title+'</span><span class="cs">'+x.s+'</span></a>';
      }).join("") + '</div>';
      c += '<div class="cols" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1px 18px">';
      TOPICS.forEach(function(t){ c += link(t[1], t[0], t[2] ? "item emph" : "item"); });
      c += '</div>';
      drawer.innerHTML = c;
      return;
    }
    drawer.innerHTML = "";
  }

  // ---- Open/close ----
  var current = null;

  // FIX 1: meet de werkelijke kaarthoogte (niet body.scrollHeight, want die is
  // nooit kleiner dan het iframe-venster → oneindige groei-lus). Meld alleen
  // bij een gewijzigde waarde.
  var lastReported = 0;
  function report(){
    try {
      if (window.parent && window.parent !== window) {
        var card = document.querySelector(".card");
        if (!card) return;
        var h = Math.ceil(card.getBoundingClientRect().height) + 12; // + body-padding (2 × 6px)
        if (h !== lastReported) {
          lastReported = h;
          window.parent.postMessage({ nlfrMenuHeight: h }, "*");
        }
      }
    } catch(e){}
  }

  function closeAll(){
    current = null;
    drawer.classList.remove("open");
    Array.prototype.forEach.call(document.querySelectorAll(".door"), function(b){ b.classList.remove("active"); });
    document.getElementById("pullbtn").classList.remove("active");
    adminBtn.classList.remove("active");
  }
  function open(target, el){
    if (current === target) { closeAll(); report(); return; }
    closeAll();
    current = target;
    build(target);
    drawer.classList.add("open");
    if (el) el.classList.add("active");
    report();
  }
  Array.prototype.forEach.call(document.querySelectorAll(".door"), function(b){
    b.addEventListener("click", function(){ open(b.getAttribute("data-door"), b); });
  });
  document.getElementById("pullbtn").addEventListener("click", function(){ open("topics", this); });
  adminBtn.addEventListener("click", function(){ open("admin", this); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") { closeAll(); report(); } });

  // ---- Search: opent de AI-zoek app ----
  var q = document.getElementById("q"), clr = document.getElementById("clear"), sbox = document.getElementById("searchbox");
  function doSearch(){ var v = q.value.trim(); if (!v) return; var url = ZOEK_APP + encodeURIComponent(v); try { window.top.location.href = url; } catch(e) { window.open(url, "_blank", "noopener"); } }
  document.getElementById("searchform").addEventListener("submit", function(e){ e.preventDefault(); doSearch(); });
  q.addEventListener("input", function(){ clr.classList.toggle("show", q.value.length > 0); });
  q.addEventListener("focus", function(){ sbox.classList.add("focus"); });
  q.addEventListener("blur", function(){ sbox.classList.remove("focus"); });
  clr.addEventListener("click", function(){ q.value = ""; clr.classList.remove("show"); q.focus(); });

  // ---- Height sync ----
  window.addEventListener("load", report);
  window.addEventListener("resize", report);
  report();
})();
</script>
</body>
</html>
