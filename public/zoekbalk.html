<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NLFR AI Zoek</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: transparent; }
  .search-wrap { display: flex; align-items: center; gap: 6px; background: #800000; border-radius: 5px; padding: 6px 8px; max-width: 850px; margin: 0 auto; }
  .search-input { flex: 1; padding: 7px 10px; border: 1px solid rgba(255,255,255,0.25); border-radius: 4px; background: rgba(255,255,255,0.12); color: #fff; font-size: 12px; font-family: inherit; outline: none; }
  .search-input::placeholder { color: rgba(255,255,255,0.55); }
  .search-input:focus { border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.18); }
  .search-btn { padding: 7px 14px; background: #fff; color: #800000; border: none; border-radius: 4px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .search-btn:hover { background: #f0e8e8; }
</style>
</head>
<body>
<div class="search-wrap">
  <input type="text" class="search-input" id="q" placeholder="Zoek in dit forum en Infofrankrijk.com..." autocomplete="off">
  <button class="search-btn" id="btn">Zoek</button>
</div>
<script>
var APP_URL = window.location.origin;

function doSearch() {
  var q = document.getElementById('q').value.trim();
  if (!q) return;
  window.open(APP_URL + '/?q=' + encodeURIComponent(q), '_blank');
}
document.getElementById('btn').addEventListener('click', doSearch);
document.getElementById('q').addEventListener('keypress', function(e) { if (e.key === 'Enter') doSearch(); });
</script>
</body>
</html>
