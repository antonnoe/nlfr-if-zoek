<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NLFR AI Zoek</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 2px 0; }
  .search-wrap { display: flex; align-items: center; gap: 6px; max-width: 850px; margin: 0 auto; }
  .search-input { flex: 1; padding: 7px 12px; border: 1px solid rgba(128,0,0,0.35); border-radius: 4px; background: #fff; color: #2a2a2a; font-size: 13px; font-family: inherit; outline: none; }
  .search-input::placeholder { color: #999; }
  .search-input:focus { border-color: #800000; box-shadow: 0 0 0 2px rgba(128,0,0,0.08); }
  .search-btn { padding: 7px 16px; background: #800000; color: #fff; border: none; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .search-btn:hover { background: #6a0000; }
</style>
</head>
<body>
<div class="search-wrap">
  <input type="text" class="search-input" id="q" placeholder="🔍 AI-zoek in dit forum en Infofrankrijk.com..." autocomplete="off">
  <button class="search-btn" id="btn">Zoek</button>
</div>
<script>
var APP_URL = 'https://nlfr-if-zoek.vercel.app';
function doSearch() {
  var q = document.getElementById('q').value.trim();
  if (!q) return;
  window.open(APP_URL + '/?q=' + encodeURIComponent(q), '_blank');
}
document.getElementById('btn').addEventListener('click', doSearch);
document.getElementById('q').addEventListener('keypress', function(e) { if (e.key === 'Enter') doSearch(); });
</script>
</body>
</html>
